<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم - سحر العيون</title>
<style>
body{margin:0;background:#0b0907;color:#f3e9d2;font-family:system-ui,Tahoma,sans-serif;padding:14px;max-width:900px;margin-inline:auto}
h1,h2,h3{color:#c9a24b;margin:.4em 0}
input,select,button,textarea{background:#1a1510;color:#f3e9d2;border:1px solid #5a4a22;border-radius:8px;padding:9px;font:inherit;box-sizing:border-box}
textarea{width:100%;min-height:80px}input[type=text],input[type=number]{width:100%}
button{cursor:pointer;background:#c9a24b;color:#111;border:0;font-weight:700}
button.sec{background:#2a2108;color:#e8cf8a;border:1px solid #5a4a22}button.red{background:#7a2020;color:#fff}
.card{border:1px solid #5a4a22;border-radius:12px;padding:12px;margin:10px 0}
label{display:block;margin:10px 0 3px;font-size:.9rem;color:#e8cf8a}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #5a4a22;padding:6px;text-align:right;vertical-align:top}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.muted{opacity:.7}.new{background:#2a2108}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.pv{max-width:160px;max-height:120px;border-radius:10px;display:block;margin:6px 0;border:1px solid #5a4a22}
.ok{color:#8fd48f}.bad{color:#ff9a9a}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={new:'جديد',confirmed:'مؤكد',shipped:'اتشحن',delivered:'اتسلم',canceled:'ملغي'};
async function api(u,b){const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const d=await r.json().catch(()=>({}));if(r.status===401&&u!=='/api/admin/login'){login();throw 0}return{ok:r.ok,d}}
function login(msg){$('#app').innerHTML='<h1>لوحة التحكم</h1><div class="card"><input id="pw" type="password" placeholder="كلمة السر" style="width:70%"> <button onclick="doLogin()">دخول</button><p class="bad">'+(msg||'')+'</p></div>';$('#pw').onkeydown=e=>{if(e.key==='Enter')doLogin()}}
async function doLogin(){const{ok,d}=await api('/api/admin/login',{password:$('#pw').value});ok?home():login(esc(d.error||'خطأ'))}
let tab='orders';
async function home(){
  const info=(await api('/api/admin/info')).d;
  $('#app').innerHTML='<h1>سحر العيون - لوحة التحكم</h1>'+
   (info.storage!=='db'?'<p class="bad">⚠ التخزين مؤقت: أي تعديل ممكن يضيع مع إعادة تشغيل السيرفر.</p>':'')+
   '<div class="tabs"><button onclick="go(\'orders\')">الطلبات</button><button onclick="go(\'products\')">المنتجات</button><button onclick="go(\'site\')">اللوجو والنصوص</button><button class="sec" onclick="testN()">إشعار تجريبي</button><a href="/api/admin/backup"><button class="sec" type="button">نسخة احتياطية</button></a><a href="/" target="_blank"><button class="sec" type="button">فتح الموقع</button></a></div><div id="c"></div>';
  ({orders,products,site})[tab]();
}
function go(t){tab=t;home()}
async function testN(){const{d}=await api('/api/admin/test-notify',{});alert('نتيجة: '+d.result)}

/* ---- الطلبات ---- */
async function orders(){
  const{d}=await api('/api/admin/orders');
  const rev=d.filter(o=>o.status!=='canceled').reduce((s,o)=>s+o.total,0);
  $('#c').innerHTML='<h2>الطلبات ('+d.length+')</h2><p class="muted">إجمالي المبيعات غير الملغية: '+rev.toLocaleString('ar-EG')+' ج.م</p><div style="overflow:auto"><table><tr><th>رقم</th><th>الوقت</th><th>العميل</th><th>العنوان</th><th>الطلب</th><th>الإجمالي</th><th>الحالة</th></tr>'+
  d.map(o=>'<tr class="'+(o.status==='new'?'new':'')+'"><td>'+esc(o.num)+'</td><td>'+esc(new Date(o.at).toLocaleString('ar-EG'))+'</td><td>'+esc(o.name)+'<br><a style="color:#c9a24b" href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a></td><td>'+esc(o.gov)+' - '+esc(o.addr)+(o.notes?'<br><i>'+esc(o.notes)+'</i>':'')+'</td><td>'+o.items.map(i=>esc(i.name)+' ×'+i.qty).join('<br>')+'</td><td>'+o.total+'</td><td><select onchange="setSt(\''+esc(o.num)+'\',this.value)">'+Object.keys(ST).map(k=>'<option value="'+k+'"'+(o.status===k?' selected':'')+'>'+ST[k]+'</option>').join('')+'</select></td></tr>').join('')+'</table></div>';
}
async function setSt(num,status){await api('/api/admin/status',{num,status});orders()}

/* ---- الصور ---- */
function pickImage(input,max,cb){
  const f=input.files[0];if(!f)return;
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',.82));URL.revokeObjectURL(u)};
  img.onerror=()=>alert('الملف ده مش صورة');img.src=u;
}

/* ---- المنتجات ---- */
let PL=[],PIMG={};
async function products(){
  PL=await (await fetch('/api/products')).json();PIMG={};
  $('#c').innerHTML='<h2>المنتجات</h2><button onclick="addP()">+ منتج جديد</button><div id="pl"></div>';
  $('#pl').innerHTML=PL.map(pform).join('');
}
function pform(p){
  const id=p?p.id:'new';p=p||{name:'',notes:'',price:'',old:'',tag:'',stock:true};
  return '<div class="card" id="pc'+id+'"><h3>'+(p.name?esc(p.name):'منتج جديد')+'</h3>'+
  '<div class="row"><div><label>الاسم</label><input type="text" id="n'+id+'" value="'+esc(p.name)+'"></div><div><label>شارة (مثلاً: الأكثر مبيعاً)</label><input type="text" id="t'+id+'" value="'+esc(p.tag||'')+'"></div></div>'+
  '<label>الوصف</label><input type="text" id="d'+id+'" value="'+esc(p.notes)+'">'+
  '<div class="row"><div><label>السعر (ج.م)</label><input type="number" id="pr'+id+'" value="'+esc(p.price)+'"></div><div><label>السعر قبل الخصم (اختياري)</label><input type="number" id="od'+id+'" value="'+esc(p.old||'')+'"></div></div>'+
  '<label>الصورة</label>'+(p.image?'<img class="pv" id="pv'+id+'" src="'+p.image+'">':'<img class="pv" id="pv'+id+'" style="display:none">')+
  '<input type="file" accept="image/*" onchange="pickImage(this,700,u=>{PIMG[\''+id+'\']=u;var v=document.getElementById(\'pv'+id+'\');v.src=u;v.style.display=\'block\'})">'+
  '<label><input type="checkbox" id="st'+id+'"'+(p.stock!==false?' checked':'')+'> متوفر في المخزون</label>'+
  '<div class="tabs"><button onclick="saveP(\''+id+'\')">حفظ</button>'+(p.id?'<button class="red" onclick="delP('+p.id+')">حذف</button>':'')+'</div></div>';
}
function addP(){if($('#pcnew'))return;$('#pl').insertAdjacentHTML('afterbegin',pform(null))}
async function saveP(id){
  const b={name:$('#n'+id).value,tag:$('#t'+id).value,notes:$('#d'+id).value,price:$('#pr'+id).value,old:$('#od'+id).value,stock:$('#st'+id).checked};
  if(id!=='new')b.id=Number(id);
  if(PIMG[id])b.image=PIMG[id];
  const{ok,d}=await api('/api/admin/product',b);
  if(ok){alert('تم الحفظ ✓');products()}else alert(d.error||'خطأ')
}
async function delP(id){if(!confirm('متأكد إنك عايز تحذف المنتج؟'))return;await api('/api/admin/product-delete',{id});products()}

/* ---- اللوجو والنصوص ---- */
let S={},LOGO=null;
const TXT=[['brandName','اسم البراند (بجانب اللوجو لو مفيش صورة)'],['brandSub','السطر الصغير تحت الاسم'],['heroEyebrow','سطر صغير فوق العنوان'],['heroTitle1','العنوان الرئيسي - الكلمة الأولى'],['heroTitle2','العنوان الرئيسي - الكلمة الملونة'],['collectionEyebrow','قسم المنتجات - سطر صغير'],['collectionTitle','قسم المنتجات - العنوان'],['aboutTitle1','عن البراند - الكلمة الأولى'],['aboutTitle2','عن البراند - الكلمة الملونة'],['reviewsTitle','عنوان الآراء'],['footerText','نص أسفل الصفحة'],['copyright','حقوق النشر']];
const CLR=[['colorGold','لون الذهبي (الرئيسي)'],['colorGoldLight','الذهبي الفاتح'],['colorBg','لون الخلفية'],['colorCard','لون الكروت'],['colorText','لون الكتابة']];
async function site(){
  S=(await(await fetch('/api/site')).json()).settings;LOGO=null;
  $('#c').innerHTML='<h2>اللوجو والنصوص</h2><div class="card"><h3>اللوجو</h3><div id="lg"></div><input type="file" accept="image/*" onchange="pickImage(this,400,u=>{LOGO=u;lgShow(u)})"> <button class="sec" onclick="LOGO=\'\';lgShow(\'\')">إزالة اللوجو (يرجع الاسم)</button></div>'+
  '<div class="card"><h3>النصوص</h3>'+TXT.map(([k,l])=>'<label>'+l+'</label><input type="text" id="s_'+k+'" value="'+esc(S[k])+'">').join('')+
  '<label>الجملة تحت العنوان الرئيسي</label><textarea id="s_heroSub">'+esc(S.heroSub)+'</textarea><label>حكاية البراند</label><textarea id="s_aboutText">'+esc(S.aboutText)+'</textarea></div>'+
  '<div class="card"><h3>الألوان والأقسام</h3><div class="row">'+CLR.map(([k,l])=>'<div><label>'+l+'</label><input type="color" id="s_'+k+'" value="'+esc(S[k])+'" style="width:100%;height:42px;padding:2px"></div>').join('')+'</div><label><input type="checkbox" id="s_showAbout"'+(S.showAbout!==false?' checked':'')+'> إظهار قسم حكاية البراند والمميزات</label><label><input type="checkbox" id="s_showReviews"'+(S.showReviews!==false?' checked':'')+'> إظهار قسم آراء العملاء</label></div>'+
  '<div class="card"><h3>المميزات</h3><div id="featBox"></div><button class="sec" onclick="addFeat()">+ إضافة ميزة</button></div>'+'<div class="card"><h3>آراء العملاء</h3><div id="revBox"></div><button class="sec" onclick="addRev()">+ إضافة رأي</button></div>'+'<button onclick="saveSite()" style="width:100%;padding:14px">حفظ كل التعديلات</button>';
  lgShow(S.logoImage||'');drawFeat();drawRev();
}
function collect(){S.features=[...document.querySelectorAll('#featBox .it')].map(e=>({ico:e.querySelector('.a').value,title:e.querySelector('.b').value,desc:e.querySelector('.c').value}));S.reviews=[...document.querySelectorAll('#revBox .it')].map(e=>({name:e.querySelector('.a').value,stars:e.querySelector('.b').value,text:e.querySelector('.c').value}))}
function drawFeat(){$('#featBox').innerHTML=S.features.map((f,i)=>'<div class="it"><div class="row"><div><label>أيقونة / إيموجي</label><input type="text" class="a" value="'+esc(f.ico)+'"></div><div><label>العنوان</label><input type="text" class="b" value="'+esc(f.title)+'"></div></div><label>الوصف</label><input type="text" class="c" value="'+esc(f.desc)+'"> <button class="red" onclick="collect();S.features.splice('+i+',1);drawFeat()">حذف</button><hr></div>').join('')}
function addFeat(){collect();S.features.push({ico:'⭐',title:'',desc:''});drawFeat()}
function drawRev(){$('#revBox').innerHTML=S.reviews.map((r,i)=>'<div class="it"><div class="row"><div><label>الاسم</label><input type="text" class="a" value="'+esc(r.name)+'"></div><div><label>عدد النجوم (1-5)</label><input type="number" min="1" max="5" class="b" value="'+r.stars+'"></div></div><label>الرأي</label><textarea class="c">'+esc(r.text)+'</textarea><button class="red" onclick="collect();S.reviews.splice('+i+',1);drawRev()">حذف</button><hr></div>').join('')}
function addRev(){collect();S.reviews.push({name:'',stars:5,text:''});drawRev()}
function _unused(){return ''+S.features.map((f,i)=>'<div class="row"><div><label>أيقونة / إيموجي</label><input type="text" id="fi'+i+'" value="'+esc(f.ico)+'"></div><div><label>العنوان</label><input type="text" id="ft'+i+'" value="'+esc(f.title)+'"></div></div><label>الوصف</label><input type="text" id="fd'+i+'" value="'+esc(f.desc)+'"><hr>').join('')+'</div>'+
  '<div class="card"><h3>آراء العملاء</h3>'+S.reviews.map((r,i)=>'<div class="row"><div><label>الاسم</label><input type="text" id="rn'+i+'" value="'+esc(r.name)+'"></div><div><label>عدد النجوم (1-5)</label><input type="number" min="1" max="5" id="rs'+i+'" value="'+r.stars+'"></div></div><label>الرأي</label><textarea id="rt'+i+'">'+esc(r.text)+'</textarea><hr>').join('')+'</div>'+
  '<button onclick="saveSite()" style="width:100%;padding:14px">حفظ كل التعديلات</button>';
  lgShow(S.logoImage||'');
}
function lgShow(u){$('#lg').innerHTML=u?'<img class="pv" style="max-height:80px;background:#000" src="'+u+'">':'<p class="muted">مفيش لوجو صورة حالياً، بيظهر الاسم كنص.</p>'}
async function saveSite(){
  const b={};
  TXT.forEach(([k])=>b[k]=$('#s_'+k).value);b.heroSub=$('#s_heroSub').value;b.aboutText=$('#s_aboutText').value;
  CLR.forEach(([k])=>b[k]=$('#s_'+k).value);b.showAbout=$('#s_showAbout').checked;b.showReviews=$('#s_showReviews').checked;
  collect();b.features=S.features;b.reviews=S.reviews;
  if(LOGO!==null)b.logoImage=LOGO;
  const{ok,d}=await api('/api/admin/settings',b);alert(ok?'تم الحفظ ✓ افتح الموقع وحدّث الصفحة':(d.error||'خطأ'));if(ok)site()
}
api('/api/admin/info').then(home).catch(()=>login());
</script></body></html>
